########################################################################  


LTO="-flto=auto"
COMMON_FLAGS="-march=native -O2 -pipe -fno-semantic-interposition ${LTO}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="-fuse-ld=mold -Wl,-O1 -Wl,--as-needed"
RUSTFLAGS="-C target-cpu=native"

CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"

MAKEOPTS="-j18 -l18"
ACCEPT_KEYWORDS="amd64"
ACCEPT_LICENSE="*"
FEATURES="candy clean-logs buildpkg parallel-install"
EMERGE_DEFAULT_OPTS="--ask --autounmask-write=y --keep-going=y --with-bdeps=y"
AUTOCLEAN="yes"

PORTAGE_NICENESS=19
PORTAGE_SCHEDULING_POLICY="idle"
PORTAGE_IONICE_COMMAND="ionice -c 3 -p \${PID}"

BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="--long --threads=4 --adapt=min=7,max=19"

DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"

VIDEO_CARDS="intel nvidia"
INPUT_DEVICES="libinput"
SANE_BACKENDS="hp"
L10N="en en-GB pt pt-PT"

USE_ENABLED="acpi branding cryptsetup dbus iwd jit lm-sensors lto pgo udisks unwind zram"
USE_DISABLED="-X -bindist -doc -gnome -gtk2 -handbook -kde -man -openrc -qt4 -qt5 -telemetry"
AUDIO="alsa jack ladspa midi pipewire pulseaudio rubberband sndfile sound vamp"
CODECS="aac alac cdda flac id3tag lame mp3 mpg123 ogg opus sox speex vorbis wavpack"
GRAPHICS="dri egl gles2 glvnd opengl vaapi vulkan wayland"
MISC="bluetooth encode jpeg lcms mtp nvenc png svg usb webp xml zip zstd"

USE="${USE_ENABLED} ${USE_DISABLED} ${AUDIO} ${CODECS} ${GRAPHICS} ${MISC}"

LC_MESSAGES=C
